<main class="poesia">
    <p>
        Prima di tutto la <span class="parola" onclick="mostraSpiegazione('musicalita')">
        musica
        </span>, e sempre!<br>
        E per questo preferisci l’Impari<br>
        più vago e più solubile nell’aria.
    </p>

    <p>
        Nulla di più caro della canzone grigia<br>
        dove l’Indeciso si unisce al <span class="parola" onclick="mostraSpiegazione('poesia_pura')">
        Preciso
        </span>.
    </p>
