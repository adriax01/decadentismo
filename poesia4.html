<body>

<header>
    <h1>Vocali</h1>
    <p>Arthur Rimbaud</p>
</header>

<main class="poesia">
    <p>
        A nera, E bianca, I rossa, U verde, O blu: vocali,<br>
        dirò un giorno le vostre <span class="parola" onclick="mostraSpiegazione('sinestesia')">
        nascite latenti
        </span>.<br>
        A, nera corsa pelosa di mosche lucenti<br>
        che ronzano intorno a crudeli fetori.
    </p>

    <p>
        I, porpora, sputi di sangue, risa<br>
        di labbra belle nell’ira o nei <span class="parola" onclick="mostraSpiegazione('visionarieta')">
        rimorsi ebbri
        </span>.
    </p>

<a href="index.html" class="torna">

</main>
