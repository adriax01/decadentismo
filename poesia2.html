<body>

<header>
    <h1>Il gelsomino notturno</h1>
    <p>Giovanni Pascoli</p>
</header>

<main class="poesia">
    <p>
        E s'aprono i fiori notturni,<br>
        nell'ora che penso ai miei cari.<br>
        Sono apparse in mezzo ai viburni<br>
        le <span class="parola" onclick="mostraSpiegazione('simbolismo')">
        farfalle crepuscolari
        </span>.
    </p>

    <p>
        Dai calici aperti si esala<br>
        l'odore di fragole rosse.<br>
        Splende un lume là nella sala.<br>
        Nasce l'erba sopra le fosse.
    </p>
